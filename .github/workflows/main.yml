name: Run 24/7 Options Bot

on:
  schedule:
    # هذا الجدول يجعل البوت يعمل تلقائياً كل ساعة على مدار 24 ساعة طوال أيام الأسبوع
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Bot Script
        run: python bot.py
